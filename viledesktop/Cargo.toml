[workspace]
resolver = "2"
members = ["vile-protocol", "viledaemon", "vilebar", "vile", "vilecolors", "vilewall", "vileshot", "vilefox"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
vile-protocol = { path = "vile-protocol" }
anyhow = "1"
calloop = "0.14"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
env_logger = "0.11"
log = "0.4"
niri-ipc = "=26.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1"
unicode-width = "0.2"

[profile.dev.package.image]
opt-level = 3

[profile.dev.package.png]
opt-level = 3

[profile.dev.package.jpeg-decoder]
opt-level = 3

[profile.dev.package.vilewall]
opt-level = 2
