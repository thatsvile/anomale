search_width=350
background_color=pywal_color0
background_opacity=0.6
# apps_background_color=pywal_color0
# apps_opacity=0.4
# search_background_color=pywal_color1
# search_background_opacity=0.9
border_color=pywal_color6
border_width=2
border_radius=0
text_color=pywal_color6
font_family=monospace
font_size=14.0
selection_color=pywal_color6
selection_text_color=pywal_color1
highlight_color=pywal_color2
highlight_text_color=pywal_color0

# Power Menu
power_3=Reboot:systemctl reboot
power_1=Shutdown:systemctl poweroff
power_2=Logout:niri msg action quit --skip-confirmation

# Wallpaper Selector
wallpapers_path=~/Pictures/wallpaper/
wallpapers_thumb_size=200
# Legacy fallback when no named commands are defined (also used if wallpaper_command_default is missing)
wallpapers_command=wal --backend haishoku -i [[w]] && pywalfox update
# Named wallpaper commands — each appears in the per-thumbnail dropdown menu
lightmode_wallpaper_command=wal --backend colorz -l -i [[w]] && pywalfox update
darkmode_wallpaper_command=wal --backend colorz --contrast 2.0 -i [[w]] && pywalfox update
darkmode-black-background_wallpaper_command=wal --backend colorz -i [[w]]; swaybg -i [[w]] -m fill &
# Default command for click/Enter (must match a named command above)
wallpaper_command_default=darkmode
# Runs as a separate command after the main wallpaper command finishes
wallpaper_command_post=niri msg action load-config-file
# Re-applies the last selected wallpaper when anomale starts (requires use_last_wall=true).
# Note: niri session startup scripts may also restore wallpaper from ~/.cache/wal/wal via swaybg,
# independent of this setting.
use_last_wall=true
