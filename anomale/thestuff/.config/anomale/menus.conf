search_width=350
background_color=pywal_color0
background_opacity=1
border_color=pywal_color6
border_width=2
border_radius=16
text_color=pywal_color6
font_family=0xProto Nerd Font
font_size=14.0
selection_color=pywal_color6
selection_text_color=pywal_color1
highlight_color=pywal_color2
highlight_text_color=pywal_color0
search_background_opacity=1

#apps launcher settings
apps_opacity=0.7

# Power Menu
power_3=Reboot:systemctl reboot
power_1=Shutdown:systemctl poweroff
power_2=Logout:niri msg action quit skip-confirmation=true
power_opacity=0.7

# Wallpaper Selector
# This path is searched to display options in your wallpaper selector popup
wallpapers_path=~/Pictures/wallpaper/
wallpapers_thumb_size=200
# The [[w]] placeholder is used where you would like anomale to insert the path to the selected image into your wallpaper set/theme application
# Legacy fallback when no named commands are defined
wallpapers_command=wal --backend haishoku --contrast 2.0 --cols16 foxify-lighten -i [[w]] && pywalfox update
# Named wallpaper commands — each appears in the per-thumbnail dropdown menu
haishoku_wallpaper_command=wal --backend haishoku --contrast 2.0 --cols16 foxify-lighten -i [[w]] && pywalfox update
colorz_wallpaper_command=wal --backend colorz --contrast 2.0 --cols16 foxify-lighten -i [[w]] && pywalfox update
# Default command for click/Enter (must match a named command above)
wallpaper_command_default=haishoku
# Runs as a separate command after the main wallpaper command finishes
wallpaper_command_post=niri msg action load-config-file; anomale --refresh && wal-refresh.sh
# Only run the full pywal pipeline when picking a wallpaper from the menu.
# use_last_wall=true makes every anomale start re-run wal synchronously before the bar can appear.
# Note: niri session startup scripts may also restore wallpaper from ~/.cache/wal/wal via swaybg, independent of this setting.
use_last_wall=false
#opacity of wallpaper menu (use 1.0 if compositor blur is off)
wallpapers_opacity=1
